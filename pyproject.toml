[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "medsam2-mlx"
version = "0.2.8"
description = "Segment lesions or organs from a box, point or mask prompt, then track them through a volume with MedSAM2"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Joseph Sandoval" },
  { name = "Alfredo Sandoval Jr." },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
keywords = [
  "mlx",
  "apple-silicon",
  "metal",
  "medical-imaging",
  "medsam2",
  "sam2",
  "segmentation",
  "ct",
  "mri",
]
dependencies = [
  "mlx==0.32.4; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "medmlx-core==0.2.6",
  "nibabel>=5.3,<6",
  "numpy>=2.0,<3",
  "pillow>=13,<14",
  "scipy>=1.13,<2",
]

[project.entry-points."medmlx.models"]
medsam2 = "medsam2_mlx.medmlx:MODEL"

[project.urls]
Homepage = "https://medmlx.org"
Documentation = "https://github.com/MedMLX/medsam2-mlx/blob/v0.2.8/README.md"
Repository = "https://github.com/MedMLX/medsam2-mlx"
Issues = "https://github.com/MedMLX/medsam2-mlx/issues"
Weights = "https://huggingface.co/MedMLX/medsam2-mlx"
MedMLX = "https://github.com/MedMLX/medmlx"

[project.optional-dependencies]
# Runs the upstream PyTorch MedSAM2 for scripts/make_reference_fixtures.py and
# scripts/qualify_checkpoint.py; never imported by the package.
reference = [
  "torch>=2.6,<3",
  "hydra-core>=1.3.8,<1.4",
  "iopath>=0.1.10,<0.2",
  "tqdm>=4.66,<5",
  "opencv-python-headless==5.0.0.93",
  "pillow>=13,<14",
  "SimpleITK>=2.5,<3",
]
dev = [
  "SimpleITK>=2.5.6,<3",
  "pyright==1.1.414",
  "pytest>=8.4,<10",
  "ruff>=0.13,<1",
  "torch>=2.6,<3",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
constraint-dependencies = ["setuptools>=84.1.0", "filelock>=4.2.1", ]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.hatch.build.targets.wheel]
packages = ["src/medsam2_mlx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
extend-select = ["TID251", "TID252", "ANN401"]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["scripts","src","tests","typings"]
extraPaths = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = {msg = "Use a precise type and parse untyped values at the boundary."}
"typing_extensions.Any" = {msg = "Use a precise type and parse untyped values at the boundary."}

[tool.hatch.build.targets.sdist]
only-include = [
  "src/medsam2_mlx",
  "pyproject.toml",
  "README.md",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
]
